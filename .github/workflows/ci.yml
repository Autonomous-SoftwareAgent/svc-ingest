# CI của Ingest (S-023). Job test là của dịch vụ; job image là của nền (đóng gói, quét bí mật, đẩy Docker Hub).
# Test chạy trong ảnh Python 3.13 (ghim bằng mã băm) để không cần thêm action cài Python; PostgreSQL chạy kèm.
# Ba ca RQM trong tests/test_kafka_rqm.py cần broker thật và quyền `docker pause` container: trên GitHub chúng tự BỎ QUA
# (thiếu INGEST_TEST_KAFKA_*), tức CI KHÔNG phủ phần Kafka. Không dùng broker dùng chung của hệ cho ca đó.
# Mã commit của action là bản đã được workflow chung của nền ghim (service-image.yml).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    container: python:3.13-slim@sha256:bf44cdfcb76cd3b41e879bc058fc37ec5872002ccfde7fcb765e218cde0cd79c
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: ingest
          POSTGRES_DB: ingest
        options: >-
          --health-cmd "pg_isready -U ingest -d ingest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INGEST_TEST_DATABASE_URL: postgresql+psycopg://ingest:test@postgres:5432/ingest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install -e ".[dev]"
      - run: python -m pytest -p no:cacheprovider -ra
  image:
    needs: test
    uses: tochuc-cu/platform/.github/workflows/service-image.yml@main
    secrets: inherit
