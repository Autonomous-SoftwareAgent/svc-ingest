schema: 1
diagrams:
  - id: "tu-sinh-cac-lop"
    review:
      verdict: "đúng"
      note: "Số tệp mỗi lớp khớp thư mục thật; số lệnh nhập khớp (core->contract 4, io 3, normalize 2, main->core 6). Không có cạnh ngược lên main/config."
      basis: "d7d0090f6c5b45a7"
      at: "2026-10-07"
    explain:
      meaning: "Sơ đồ gom các tệp mã thành năm nhóm và cho biết nhóm nào nhập nhóm nào. Nó trả lời nhanh câu hỏi: dịch vụ có giữ đúng nguyên tắc ba lớp, một chiều không. Với Ingest, điều đó nghĩa là phần quyết định có nhận dữ liệu của nhà cung cấp hay không, và có ghi xuống DB hay không, không phụ thuộc vào HTTP hay Kafka."
      read:
        - "Mỗi ô là một lớp, kèm số tệp và tên vài tệp đầu."
        - "Mũi tên có số là số lệnh nhập đi từ lớp này sang lớp kia."
        - "Mọi lớp trừ nhóm Ngoài các lớp chỉ trỏ vào Hợp đồng chuẩn; không có mũi tên giữa chuẩn hóa, logic và vào/ra với nhau."
        - "Nét đậm là nhóm Ngoài các lớp nhập nhiều nhất từ lớp logic (6 lệnh) vì main.py nối các hàm của core."
      details:
        - term: "Hợp đồng chuẩn"
          text: "Một tệp contract.py: loại message, mã lỗi, kiểu dữ liệu chuẩn và cổng Publisher. Là chỗ duy nhất ba lớp gặp nhau."
        - term: "Lớp chuẩn hóa"
          text: "normalize/: mỗi định dạng của nhà cung cấp một module (hiện chỉ inventory_rates_json), tự đăng ký vào registry. Thêm định dạng là thêm tệp."
        - term: "Lớp logic nội bộ"
          text: "core/: nhận lần gửi, chống trùng, đổi mã, outbox, relay, danh mục, xác thực, cache, bảng PostgreSQL."
        - term: "Lớp vào/ra"
          text: "io/: HTTP (FastAPI), Kafka (aiokafka), và hai cổng phát đơn giản (log, bộ nhớ) dùng khi chạy thử và test."
        - term: "Ngoài các lớp đã khai"
          text: "config.py, main.py (điểm nối), gói ingest/__init__.py và tools/sim/supplier.py (nhà cung cấp mô phỏng)."
      pitfalls:
        - "Số lệnh nhập chỉ đếm nhập tĩnh; việc nạp module chuẩn hóa bằng importlib không được đếm."
        - "Hình không nói lớp nào được phép nhập lớp nào: luật đó nằm trong tests/test_layers.py và CONVENTIONS.md, hình chỉ cho thấy hiện trạng."
        - "Ingest chưa có lớp thứ hai cho cùng một việc (một định dạng, một broker thật), nên chưa kiểm được chuyện thêm bên ngoài thứ hai có thật sự không sửa lớp cũ."
      basis: "d7d0090f6c5b45a7"
  - id: "tu-sinh-cua-vao-ra"
    review:
      verdict: "đúng"
      note: "8 đường dẫn khớp io/http.py (dòng 145-229), 6 bảng khớp core/schema.py. Topic là mặc định config.py:18-20; mã không tạo topic (io/kafka.py), nhãn \"khai ở infra\" chỉ đúng khi infra tạo sẵn."
      basis: "874a485a60bbe4fe"
      at: "2026-10-07"
    explain:
      meaning: "Sơ đồ liệt kê mọi cửa vào và cửa ra của Ingest: nhà cung cấp và dịch vụ nội bộ gọi vào đâu, dữ liệu nằm ở bảng nào, tin phát lên topic nào, và dịch vụ phụ thuộc vào gì. Với người nhận phòng và giá, đây là chỗ biết dữ liệu vào bằng cửa nào và đi ra bằng topic nào."
      read:
        - "Khung bên trái là cửa vào: các đường dẫn HTTP đọc từ mã, gom theo tiền tố."
        - "Hình tròn giữa là Ingest. Nét đậm từ cửa vào tới Ingest ghi số đường dẫn (8)."
        - "Khung Dữ liệu và sự kiện là nơi Ingest ghi: sáu bảng (hình trụ) và ba topic (hình viên thuốc)."
        - "Khung Phụ thuộc vào là điều Ingest cần để chạy: PostgreSQL, Kafka, hệ thống của nhà cung cấp."
      details:
        - term: "/v1"
          text: "POST /v1/inventory-rates: cửa của nhà cung cấp. Cần Basic, X-Trace-Id (UUID bắt buộc), X-Channel-Id tùy chọn; trả 202 kèm TicketId sau khi đã lưu."
        - term: "/internal/v1"
          text: "Sáu đường dẫn cho dịch vụ nội bộ và người vận hành: tạo và liệt kê đối tác, đặt khách sạn, phòng, gói giá, xem danh mục. Cần Bearer token (INGEST_INTERNAL_TOKEN); chưa đặt thì từ chối hết."
        - term: "/healthz"
          text: "GET, kiểm DB thật và trả số message chưa gửi (outboxPending)."
        - term: "6 bảng"
          text: "partner, hotel_access, room_map, rate_plan_map (danh mục để đổi mã), submission (nhật ký lần gửi đã ACK, khóa chống trùng) và outbox (hộp thư đi)."
        - term: "ingest.ari.inventory"
          text: "Tin tồn (số phòng bán được). Tên mặc định, đổi bằng INGEST_TOPIC_INVENTORY."
        - term: "ingest.ari.restrictions"
          text: "Tin điều kiện bán: đóng bán, đóng nhận hoặc trả phòng, số đêm tối thiểu và tối đa. Đổi bằng INGEST_TOPIC_RESTRICTIONS."
        - term: "ingest.ari.rates"
          text: "Tin giá theo số khách kèm phụ thu. Đổi bằng INGEST_TOPIC_RATES."
        - term: "Hệ thống của nhà cung cấp"
          text: "Bên đẩy dữ liệu vào bằng HTTP; hiện chỉ có nhà cung cấp mô phỏng, chưa kiểm với nhà cung cấp thật."
      pitfalls:
        - "Hình không nói dịch vụ nào ĐỌC ba topic: hiện chưa có bên nhận nào (Inventory, worker) ngoài worker tham chiếu trong test."
        - "Mã không tạo topic; nhãn khai ở infra chỉ đúng khi hạ tầng đã tạo sẵn ba topic."
        - "Hình không nói thứ tự: các message của một phòng cùng khóa phân vùng giữ thứ tự, nhưng giữa các phòng và giữa ba topic thì không."
        - "Cửa ra duy nhất là Kafka; không có webhook hay gọi HTTP ra ngoài."
        - "Mới thử với Kafka và Redpanda một nút chạy cục bộ; broker production chưa kiểm."
      basis: "874a485a60bbe4fe"
  - id: "tu-sinh-phu-thuoc-module"
    review:
      verdict: "đúng"
      note: "Khớp lệnh nhập thật của từng tệp (tệp chuẩn hóa nay là inventory_rates_json.py). Chỉ thiếu cạnh nạp động normalize/__init__.py -> inventory_rates_json.py (importlib, dòng 16-19), máy không đọc ra; đã khai bằng context_relate."
      basis: "c59c5ef42f433b71"
      at: "2026-10-07"
    explain:
      meaning: "Sơ đồ cho thấy tệp mã nào của Ingest dựa vào tệp nào, theo lệnh nhập đọc từ mã. Điều quan trọng với tồn, giá và đơn: logic nhận lần gửi và ghi outbox (core) không biết gì về HTTP, Kafka hay định dạng của nhà cung cấp, nên đổi nhà cung cấp hay đổi broker không đụng tới chỗ lưu dữ liệu đã nhận."
      read:
        - "Mỗi khung là một lớp: chuẩn hóa, hợp đồng chuẩn, logic nội bộ, vào/ra, và nhóm ngoài lớp (điểm nối, cấu hình, công cụ mô phỏng)."
        - "Mỗi dòng trong khung là một tệp kèm số dòng; mũi tên giữa hai tệp là lệnh nhập thật."
        - "Mũi tên giữa hai khung là tổng số lệnh nhập đi từ lớp này sang lớp kia; nét đậm là nhóm có nhiều lệnh nhập nhất (main.py nối mọi lớp)."
        - "Đọc từ ngoài vào: main.py nhập tất cả; mọi lớp chỉ nhập contract.py (hợp đồng chuẩn) và các tệp cùng lớp."
      details:
        - term: "contract.py"
          text: "Hợp đồng chuẩn: loại message (inventory, restrictions, rates), mã lỗi, kiểu Update và NormalizedSubmission, cổng Publisher. Không nhập gì khác của dịch vụ; ba lớp gặp nhau ở đây."
        - term: "normalize/inventory_rates_json.py"
          text: "Đọc gói JSON của nhà cung cấp (hotelid, room, date...), tách theo thứ trong tuần và theo loại, bỏ dòng sai. Tự đăng ký tên inventory-rates-json qua registry.py."
        - term: "normalize/__init__.py"
          text: "Nạp mọi module định dạng trong thư mục bằng importlib. Lệnh nhập động này máy không thấy, nên không có mũi tên tới inventory_rates_json.py trên hình (đã khai riêng bằng context_relate)."
        - term: "core/service.py"
          text: "Nhận một lần gửi đã chuẩn hóa: kiểm trùng, đổi mã phòng và gói giá qua cache, ghi submission cùng outbox trong một transaction, rồi mới trả TicketId. Chỉ nhập contract, cache, schema."
        - term: "core/relay.py"
          text: "Đọc outbox theo id tăng dần và phát qua cổng Publisher; chỉ đánh dấu đã gửi khi broker xác nhận. Chỉ nhập contract và schema nên không biết Kafka."
        - term: "core/catalog.py"
          text: "Nạp và tra danh mục đối tác, khách sạn, phòng, gói giá; dùng hash mật khẩu của auth.py và xóa cache khi danh mục đổi. Do main.py gọi, service.py không gọi."
        - term: "core/auth.py"
          text: "Băm mật khẩu và xác thực đối tác bằng bảng partner."
        - term: "io/http.py"
          text: "Giao thức HTTP: xác thực Basic, X-Trace-Id, giới hạn kích thước, đổi mã lỗi sang trạng thái HTTP. Chỉ nhập contract; xác thực, chuẩn hóa và ghi được main.py tiêm vào."
        - term: "io/kafka.py"
          text: "Cổng phát lên Kafka bằng aiokafka (acks=all, idempotent). Chỉ nhập contract."
        - term: "main.py"
          text: "Điểm nối duy nhất: dựng cấu hình, cache, các hook, ứng dụng HTTP và tác vụ relay nền. Không lớp nào nhập ngược main.py hay config.py."
        - term: "tools/sim/supplier.py"
          text: "Nhà cung cấp mô phỏng để chạy thử, nằm ngoài các lớp; không phải một phần của dịch vụ chạy thật."
      pitfalls:
        - "Mũi tên chỉ là lệnh nhập, không phải luồng dữ liệu lúc chạy: dữ liệu đi từ io/http qua chuẩn hóa tới core nhờ main.py nối, không nhờ lệnh nhập trực tiếp."
        - "core/service.py không gọi catalog.py hay auth.py; hai tệp đó chỉ do main.py gọi (nạp danh mục qua API nội bộ, xác thực khi có yêu cầu)."
        - "Cạnh nạp động normalize/__init__.py tới inventory_rates_json.py và việc chọn Kafka hay log lúc chạy (INGEST_PUBLISHER) không hiện trên hình."
        - "Ranh giới giữa các lớp được test quét lệnh nhập (tests/test_layers.py) giữ; hình chỉ phản ánh mã đã commit."
      basis: "c59c5ef42f433b71"
