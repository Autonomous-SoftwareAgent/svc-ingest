schema: 1
service: "ingest"
title: "Ingest (cửa nhận tồn và giá khách sạn)"
summary: "Cửa nhận tồn phòng, điều kiện bán và giá khách sạn do nhà cung cấp đẩy vào. Kiểm người gửi và quyền theo khách sạn, đổi mã phòng và gói giá sang mã nội bộ, chống trùng, lưu bền rồi mới báo đã nhận, sau đó phát lên Kafka. Không giữ số phòng hay giá hiện tại và không tính giá."
updated: "2026-10-08"
business:
  goal: "Để số phòng còn bán, điều kiện bán và giá mà khách thấy khi tìm và đặt khớp với hệ thống của nhà cung cấp: chuẩn hóa mã, kiểm quyền theo khách sạn, rồi mới đẩy đi."
  users:
    - who: "Hệ thống của nhà cung cấp khách sạn"
      need: "Tự động gửi cập nhật số phòng, điều kiện bán và giá (chỉ phần thay đổi) và biết ngay là đã được nhận"
    - who: "Dịch vụ nội bộ và người vận hành"
      need: "Đăng ký đối tác, cấp quyền khách sạn, nạp danh mục phòng và gói giá, tra cứu danh mục"
    - who: "Dịch vụ nhận cập nhật (tồn, giá)"
      need: "Nhận đủ message, đúng thứ tự trong cùng phòng và gói giá, có mã định danh để khử trùng"
  value:
    - "Khách không thấy còn phòng khi đã hết, hay thấy giá cũ, vì mọi cập nhật nhà cung cấp gửi đều được ghi nhận bền trước khi báo đã nhận"
    - "Gửi lại hay mạng chập chờn không làm cập nhật bị trùng: cùng khóa và cùng nội dung thì nhận lại đúng một mã phiếu"
    - "Một dòng sai không làm hỏng cả lần gửi: mã phòng hoặc gói giá lạ thì bỏ dòng đó và báo lỗi, phần hợp lệ vẫn đi"
    - "Thêm một cách kết nối hoặc một định dạng của đối tác mới là thêm một tệp, không sửa phần đang chạy"
  flows:
    - id: "nhan-lan-gui"
      title: "Nhà cung cấp gửi tồn, điều kiện bán và giá"
      steps:
        - "Nhà cung cấp gửi gói JSON kèm tên đăng nhập, mật khẩu, mã theo dõi X-Trace-Id (UUID) và kênh gửi X-Channel-Id"
        - "Ingest kiểm tên đăng nhập và mật khẩu; sai thì trả 401"
        - "Ingest kiểm X-Trace-Id đúng UUID và nội dung không quá lớn"
        - "Chuẩn hóa gói: tách khoảng ngày theo thứ trong tuần, tách mỗi dòng thành tối đa ba loại cập nhật (tồn, điều kiện bán, giá), bỏ qua trường không gửi"
        - "Kiểm đối tác có quyền với khách sạn này; không có hoặc mã lạ thì trả 401 và không nhận gì"
        - "Đổi mã phòng và gói giá của nhà cung cấp sang mã nội bộ; mã lạ thì bỏ phần dữ liệu đó và ghi lỗi mã 10"
        - "Ghi lần gửi và các message vào outbox trong một transaction"
        - "Chỉ sau khi đã commit mới trả 202 kèm mã phiếu (ticketId); lưu lỗi thì trả lỗi, không báo đã nhận"
        - "Một tác vụ nền (relay) trong cùng tiến trình Ingest phát các message từ outbox lên Kafka"
    - id: "gui-lai-cung-khoa"
      title: "Gửi lại cùng một lần gửi"
      steps:
        - "Nhà cung cấp gửi lại với cùng X-Trace-Id và cùng nội dung (do mạng, hay không nhận được phản hồi)"
        - "Ingest trả đúng mã phiếu cũ và đánh dấu duplicate, không ghi thêm message nào"
        - "Nếu cùng X-Trace-Id nhưng nội dung khác thì trả 409, không ghi gì"
    - id: "phat-len-kafka"
      title: "Phát lên Kafka và khi Kafka lỗi"
      steps:
        - "Tác vụ nền (relay) trong cùng tiến trình đọc outbox theo id tăng dần và gửi từng message lên Kafka"
        - "Chỉ khi Kafka xác nhận mới đánh dấu đã gửi"
        - "Kafka tạm ngừng hoặc dịch vụ khởi động lại: dữ liệu đã báo đã nhận vẫn nằm trong outbox và được gửi tiếp khi hệ thống phục hồi"
        - "Lỗi ở một message thì dừng, không gửi vượt các message sau để giữ thứ tự; message lỗi chặn mọi message sau nó, của mọi khách sạn"
        - "Có thể có message gửi lặp; bên nhận khử trùng theo messageId"
    - id: "dong-bi-bo"
      title: "Dòng hoặc gói bị bỏ, bị từ chối"
      steps:
        - "Dòng sai cấu trúc (ngày sai, số âm, giá lặp số khách...): bỏ dòng, báo lỗi mã 20, các dòng khác vẫn đi"
        - "Mã phòng lạ: bỏ mọi cập nhật của phòng đó, báo mã 10. Mã gói giá lạ: bỏ điều kiện bán và giá nhưng giữ tồn, báo mã 10"
        - "Không còn dữ liệu hợp lệ nào: từ chối cả lần gửi (mã 12), không lưu gì nên cùng X-Trace-Id gửi lại được bản đã sửa"
        - "Gói không đọc được: trả 400. Quá lớn: trả 413"
  out_of_scope:
    - "Giữ số phòng còn lại hay giá hiện tại làm dữ liệu chính thức (dịch vụ nhận message giữ)"
    - "Tính giá, quản lý sản phẩm và nội dung"
    - "Đối tác kéo danh sách đặt chỗ từ VTrip"
    - "Trả kết quả xử lý cuối cho nhà cung cấp hay API tra cứu trạng thái: ACK chỉ có nghĩa đã nhận và đã lưu an toàn"
    - "Chạy lại phân tích (replay), kết nối JetStream, webhook ra, Kafka vào (chưa làm)"
  unverified:
    - "Chưa kiểm với nhà cung cấp thật: dạng gói, quy ước thứ trong tuần, cờ đóng, và nhà cung cấp thật có gửi được Basic và X-Trace-Id không"
    - "Chưa rõ ai thêm header X-Trace-Id (nhà cung cấp hay cổng trung gian)"
    - "Khóa chống trùng là (đối tác, X-Trace-Id) kèm mã băm nội dung: là giả định, chưa xác nhận"
    - "Khoảng ngày from và to được hiểu là tính cả hai đầu: giả định, chưa xác nhận"
    - "Dữ liệu không có tiền tệ nên không biết các số tiền là đồng nào"
    - "Gói không có giờ của nhà cung cấp nên không phát hiện được gửi trễ hay đảo thứ tự giữa hai lần gửi"
    - "Chỉ kiểm Kafka với broker một nút chạy cục bộ (Kafka và một lần thử với Redpanda một nút tạm), chưa kiểm cụm nhiều nút, bảo mật hay broker production"
    - "Bộ test RQM trong repo chỉ chạy với Kafka cục bộ có container riêng để tạm dừng; chưa chạy với broker dùng chung của hệ (không được tạm dừng broker dùng chung)"
    - "Danh mục khách sạn, phòng, gói giá nạp qua API nội bộ vì chưa biết nguồn thật"
    - "Mục tiêu độ trễ (dưới 10 giây kênh sở hữu, dưới 60 giây kênh đối tác, p99) là của cả đường đi và chưa được đo; test đồng thời mới 12 luồng"
    - "Chưa có dịch vụ nhận message (Inventory, worker tồn); chỉ có worker tham chiếu trong test"
    - "Hành vi khi JSON lồng cực sâu, khi kết nối DB chết giữa chừng ở bước đọc trước transaction, và khi hai relay chạy cùng lúc chỉ mới đo bằng test thử nghiệm, chưa có trong bộ test của repo (xem P-011 đến P-013)"
    - "Thời gian xác thực của tên lạ so với tên thật chỉ được kiểm là có chạy băm giả, chưa đo chênh lệch thời gian"
architecture:
  summary: "Ba lớp, phụ thuộc một chiều, gặp nhau qua hợp đồng chuẩn (contract.py). Lớp vào/ra nhận HTTP và phát Kafka; lớp chuẩn hóa dịch gói của từng đối tác thành cập nhật chuẩn; lớp lõi kiểm quyền, đổi mã, chống trùng, ghi nhật ký và outbox. Chỉ main.py nối các lớp. PostgreSQL là cơ sở dữ liệu duy nhất; Kafka là nơi phát."
  layers:
    - id: "vao-ra"
      title: "Lớp vào/ra"
      role: "Giao thức: HTTP với xác thực Basic và Bearer, giới hạn kích thước, đổi mã lỗi sang HTTP; phát ra Kafka. Không chứa nghiệp vụ"
      paths:
        - "src/ingest/io/"
    - id: "chuan-hoa"
      title: "Lớp chuẩn hóa"
      role: "Mỗi định dạng của đối tác một module tự đăng ký; dịch gói sang cập nhật chuẩn, tách khoảng ngày theo thứ trong tuần, kiểm dữ liệu vào"
      paths:
        - "src/ingest/normalize/"
    - id: "logic"
      title: "Lớp logic nội bộ"
      role: "Kiểm quyền khách sạn, đổi mã, chống trùng, ghi nhật ký và outbox, relay, danh mục. Chỉ biết dạng chuẩn"
      paths:
        - "src/ingest/core/"
    - id: "hop-dong"
      title: "Hợp đồng chuẩn"
      role: "Kiểu dữ liệu, mã lỗi, ngoại lệ và cổng Publisher dùng chung của cả ba lớp. Mọi lớp import nó; không có lời gọi nào đi qua nó"
      paths:
        - "src/ingest/contract.py"
  components:
    - id: "http"
      title: "HTTP"
      layer: "vao-ra"
      role: "POST /v1/inventory-rates cho nhà cung cấp; /internal/v1 cho dịch vụ nội bộ; /healthz kiểm cơ sở dữ liệu. Chỉ gọi các hook do main.py tiêm vào, không tự chuẩn hóa"
      paths:
        - "src/ingest/io/http.py"
    - id: "kafka"
      title: "Cổng phát Kafka"
      layer: "vao-ra"
      role: "aiokafka, acks=all, producer idempotent, tạo lại producer sau lỗi; chỉ trả về khi broker xác nhận"
      paths:
        - "src/ingest/io/kafka.py"
        - "src/ingest/io/publishers.py"
    - id: "inventory-rates-json"
      title: "Định dạng inventory-rates-json"
      layer: "chuan-hoa"
      role: "Đọc gói InvResRateRequest: ngày, dow, tồn, điều kiện bán, giá; dòng sai thì bỏ dòng"
      paths:
        - "src/ingest/normalize/inventory_rates_json.py"
        - "src/ingest/normalize/registry.py"
    - id: "nhan-lo"
      title: "Nhận lần gửi"
      layer: "logic"
      role: "Kiểm trùng, kiểm quyền khách sạn và đổi mã (đọc trước, qua cache.py và bảng ánh xạ; không gọi catalog.py hay auth.py), rồi ghi submission và outbox cùng một transaction; chỉ sau commit mới ACK"
      paths:
        - "src/ingest/core/service.py"
    - id: "relay"
      title: "Relay"
      layer: "logic"
      role: "Tác vụ nền trong cùng tiến trình (main.py khởi động): đọc outbox theo id tăng dần, gửi qua cổng Publisher, chỉ đánh dấu khi broker xác nhận; lỗi thì dừng và chặn mọi message sau"
      paths:
        - "src/ingest/core/relay.py"
    - id: "danh-muc"
      title: "Danh mục, đối tác, xác thực"
      layer: "logic"
      role: "catalog.py: danh mục và đối tác; auth.py: băm mật khẩu và đăng nhập; cache.py: nhớ tạm 24 giờ; schema.py: bảng. main.py gọi catalog và auth qua hook; core/service.py chỉ dùng cache.py và đọc bảng ánh xạ để đổi mã"
      paths:
        - "src/ingest/core/catalog.py"
        - "src/ingest/core/auth.py"
        - "src/ingest/core/cache.py"
        - "src/ingest/core/schema.py"
    - id: "noi-lop"
      title: "Nối ba lớp"
      role: "Chọn publisher, tạo hook (xác thực, nhận lần gửi, API danh mục), khởi động relay nền trong cùng tiến trình, khởi tạo bảng"
      paths:
        - "src/ingest/main.py"
        - "src/ingest/config.py"
    - id: "mo-phong"
      title: "Nhà cung cấp mô phỏng"
      role: "Script gửi gói mẫu để chạy thử; không phải nhà cung cấp thật"
      paths:
        - "tools/sim/supplier.py"
  depends_on:
    - target: "PostgreSQL"
      kind: "infra"
      via: "SQLAlchemy Core, psycopg"
      purpose: "Đối tác, danh mục, nhật ký lần gửi, outbox"
    - target: "Kafka"
      kind: "infra"
      via: "aiokafka"
      purpose: "Phát ba loại message tồn, điều kiện bán, giá"
    - target: "Hệ thống của nhà cung cấp"
      kind: "external"
      via: "HTTP, xác thực Basic"
      purpose: "Nguồn tồn, điều kiện bán và giá (chưa kiểm với nhà cung cấp thật)"
  provides:
    - to: "Nhà cung cấp"
      via: "POST /v1/inventory-rates"
      purpose: "Nhận cập nhật tồn, điều kiện bán và giá, trả ACK kèm mã phiếu"
    - to: "Dịch vụ nội bộ và người vận hành"
      via: "/internal/v1/partners..."
      purpose: "Đăng ký đối tác, cấp quyền khách sạn, nạp và tra cứu danh mục"
    - to: "Dịch vụ nhận cập nhật (Inventory, worker tồn; chưa có)"
      via: "Kafka: ingest.ari.inventory, ingest.ari.restrictions, ingest.ari.rates"
      purpose: "Cập nhật tồn, điều kiện bán và giá, có messageId để khử trùng"
  decisions:
    - id: "D-001"
      title: "Ingest riêng, Python, tách hẳn các ingest khác"
    - id: "D-002"
      title: "Phát lên Kafka qua cổng Publisher; broker production chưa chọn"
    - id: "D-003"
      title: "ACK sau commit, outbox, phát ít nhất một lần"
    - id: "D-004"
      title: "Khóa chống trùng là (đối tác, X-Trace-Id) kèm mã băm"
    - id: "D-005"
      title: "Không giữ tồn hay giá hiện tại; thứ tự theo giờ nhận"
    - id: "D-006"
      title: "Khách sạn lạ và không có quyền cùng 401 mã 31"
    - id: "D-007"
      title: "Danh mục là bản sao, nạp qua API nội bộ, cache 24 giờ"
    - id: "D-008"
      title: "Định dạng đối tác là module tự đăng ký"
    - id: "D-009"
      title: "Quy ước đọc gói inventory-rates-json"
problems:
  - id: "P-001"
    title: "Không phát hiện gửi trễ hay đảo thứ tự giữa hai lần gửi"
    severity: "medium"
    status: "open"
    found: "2026-10-05"
    updated: "2026-10-05"
    detail: "Gói của nhà cung cấp không có giờ riêng, nên Ingest chỉ gắn giờ nó nhận (receivedAt) và giữ thứ tự trong cùng khóa phân vùng. Hai lần gửi tới đảo thứ tự (lần cũ tới sau lần mới) vẫn được nhận như bình thường và có thể ghi đè số phòng hoặc giá mới bằng dữ liệu cũ ở bên nhận. Lệch với yêu cầu thứ tự theo timestamp ở tài liệu tham chiếu nếu bên nhận cần giờ của nhà cung cấp."
    refine: "Chưa tinh chỉnh. Hướng: xin nhà cung cấp gửi giờ cập nhật trong gói, hoặc Ingest giữ mốc mới nhất theo từng phòng và gói giá (đổi quyết định D-005)."
    refs:
      - "D-005"
      - "src/ingest/core/service.py"
  - id: "P-002"
    title: "Không có kênh báo lỗi hay cảnh báo cho người vận hành"
    severity: "medium"
    status: "open"
    found: "2026-10-05"
    updated: "2026-10-05"
    detail: "Các dòng bị bỏ (mã 10, 20) chỉ được trả lại cho nhà cung cấp và lưu trong cột row_errors của bảng submission. Không ai được báo khi nhà cung cấp liên tục gửi mã lạ, khi outbox đọng lại, hay khi Kafka lỗi; chỉ có log và /healthz (số outbox chưa gửi). Tài liệu tham chiếu nói cảnh báo không có người nhận thì bằng không có cảnh báo."
    refine: "Chưa tinh chỉnh. Cần chỉ số (độ trễ gửi, số outbox chưa gửi, số dòng bị bỏ theo đối tác) và người nhận cảnh báo."
    refs:
      - "src/ingest/core/service.py"
      - "src/ingest/main.py"
  - id: "P-003"
    title: "Relay chỉ chạy một bản và một message lỗi chặn mọi message sau"
    severity: "medium"
    status: "open"
    found: "2026-10-05"
    updated: "2026-10-05"
    detail: "Relay dừng ở message lỗi đầu tiên để không đảo thứ tự, nên một message không gửi được (ví dụ quá lớn, topic bị từ chối) chặn toàn bộ outbox: số phòng và giá mới của mọi khách sạn dồn lại, khách thấy dữ liệu cũ. Chưa có chọn leader, nên chạy nhiều bản Ingest cùng bật relay có thể gửi trùng hoặc lệch thứ tự (cần đặt INGEST_RELAY_ENABLED=false ở các bản còn lại)."
    refine: "Chưa tinh chỉnh. Hướng: chặn theo từng khóa phân vùng thay vì toàn bộ, chuyển message hỏng sang hàng đợi lỗi sau số lần thử, chọn leader bằng khóa của PostgreSQL."
    refs:
      - "D-003"
      - "src/ingest/core/relay.py"
  - id: "P-004"
    title: "Có thể phát lặp message, bên nhận phải khử trùng"
    severity: "medium"
    status: "open"
    found: "2026-10-05"
    updated: "2026-10-05"
