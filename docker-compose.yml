# Chạy cục bộ: Ingest + PostgreSQL + Kafka một nút. Secret lấy từ .env (không commit); mẫu ở .env.example.
# Kafka ở đây chỉ để chạy thử; chưa chọn broker production (xem docs/agent/DECISIONS.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ingest
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingest -d ingest"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:29094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:29094:29094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 12

  ingest:
    build: .
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      INGEST_DATABASE_URL: postgresql+psycopg://ingest:${POSTGRES_PASSWORD}@db:5432/ingest
      INGEST_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INGEST_INTERNAL_TOKEN: ${INGEST_INTERNAL_TOKEN:?đặt INGEST_INTERNAL_TOKEN trong .env}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
