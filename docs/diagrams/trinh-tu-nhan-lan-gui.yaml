id: "trinh-tu-nhan-lan-gui"
type: "sequence"
title: "Trình tự một lần gửi tồn, điều kiện bán và giá"
tab: "business"
sources:
  - "src/ingest/io/http.py"
  - "src/ingest/core/service.py"
  - "src/ingest/core/relay.py"
explain:
  meaning: "Sơ đồ cho thấy ai gọi ai từ lúc nhà cung cấp gửi một gói tới lúc message được phát lên Kafka. Điểm cốt lõi: Ingest chỉ báo đã nhận (202) sau khi dữ liệu đã nằm bền trong cơ sở dữ liệu, còn việc phát lên Kafka diễn ra sau đó ở tác vụ nền. Chưa có bên nhận thật."
  read:
    - "Thời gian chạy từ trên xuống; mỗi cột là một bên. Số trên mũi tên là thứ tự bước."
    - "Mũi tên liền là lời gọi, mũi tên đứt là câu trả lời."
    - "Khối rẽ nhánh có ba nhánh, chỉ đi một: gửi lặp cùng nội dung, gửi lại cùng X-Trace-Id nhưng khác nội dung, hoặc lần gửi mới."
    - "Từ bước relay đọc cơ sở dữ liệu trở đi là phần chạy nền, không nằm trong lời gọi của nhà cung cấp."
  details:
    - term: "Nhà cung cấp"
      text: "Gửi gói JSON kèm đăng nhập Basic, mã theo dõi X-Trace-Id (bắt buộc, dạng UUID) và kênh gửi X-Channel-Id (không bắt buộc)."
    - term: "Ingest (HTTP)"
      text: "Cột này gộp io/http.py, main.py và lớp chuẩn hóa: kiểm đăng nhập và X-Trace-Id, giới hạn kích thước, chuẩn hóa gói, đưa cho lõi, rồi trả câu trả lời cho nhà cung cấp."
    - term: "Ingest (lõi)"
      text: "core/service.py: kiểm trùng, kiểm quyền khách sạn, đổi mã, rồi ghi lần gửi và outbox trong cùng một transaction. Các bước kiểm đọc trước transaction đó."
    - term: "PostgreSQL"
      text: "Nơi lần gửi và outbox được lưu bền; commit xong mới được trả 202. Lưu lỗi thì trả lỗi, không báo đã nhận."
    - term: "Relay"
      text: "Tác vụ nền trong cùng tiến trình: đọc outbox theo id tăng dần, gửi lên Kafka, và chỉ đánh dấu đã gửi khi Kafka xác nhận."
    - term: "Kafka"
      text: "Nhận message với acks=all và xác nhận lại cho relay. Message có messageId để bên nhận khử trùng; hiện chưa có dịch vụ nào đọc ba topic này."
  pitfalls:
    - "202 nghĩa là đã nhận và lưu an toàn, chưa phải là tồn và giá đã được cập nhật ở bên nhận."
    - "Gửi lại cùng X-Trace-Id và cùng nội dung trả đúng mã phiếu cũ, không ghi thêm message. Cùng X-Trace-Id nhưng nội dung khác thì bị từ chối 409 (mã 40), không ghi gì. Khóa chống trùng tính theo từng đối tác."
    - "Dạng gói JSON, xác thực Basic, việc ai thêm X-Trace-Id và khóa chống trùng đều theo mô tả của người dùng, chưa kiểm với nhà cung cấp thật."
    - "Kafka mới thử với broker một nút chạy cục bộ; acks=all trên cụm nhiều nút chưa kiểm."
  basis: "c2654d5f15a4b4e2"
autonumber: true
participants:
  - id: "ncc"
    label: "Nhà cung cấp"
    actor: true
  - id: "http"
    label: "Ingest (HTTP)"
    actor: false
  - id: "loi"
    label: "Ingest (lõi)"
    actor: false
  - id: "db"
    label: "PostgreSQL"
    actor: false
  - id: "relay"
    label: "Relay"
    actor: false
  - id: "kafka"
    label: "Kafka"
    actor: false
steps:
  - message:
      from: "ncc"
      to: "http"
      text: "Gửi gói JSON kèm Basic, X-Trace-Id, X-Channel-Id"
      reply: false
  - message:
      from: "http"
      to: "loi"
      text: "Kiểm đăng nhập và X-Trace-Id, chuẩn hóa gói (tách khoảng ngày theo thứ trong tuần)"
      reply: false
  - alt:
      branches:
        - when: "Cùng X-Trace-Id và cùng nội dung đã nhận trước đó"
          steps:
            - message:
                from: "loi"
                to: "http"
                text: "Trả lại đúng TicketId cũ, không ghi thêm gì"
                reply: true
            - message:
                from: "http"
                to: "ncc"
                text: "202 kèm TicketId cũ, đánh dấu là gửi lặp"
                reply: true
        - when: "Cùng X-Trace-Id nhưng nội dung khác"
          steps:
            - message:
                from: "loi"
                to: "http"
                text: "Từ chối, mã lỗi 40, không ghi gì"
                reply: true
            - message:
                from: "http"
                to: "ncc"
                text: "409, không ghi gì"
                reply: true
      otherwise:
        steps:
          - message:
              from: "loi"
              to: "db"
              text: "Kiểm quyền khách sạn, đổi mã phòng và gói giá; ghi lần gửi và outbox cùng một transaction"
              reply: false
          - message:
              from: "db"
              to: "loi"
              text: "Đã commit"
              reply: true
          - message:
              from: "loi"
              to: "http"
              text: "TicketId mới"
              reply: true
          - message:
              from: "http"
              to: "ncc"
              text: "202 kèm TicketId: đã nhận và lưu an toàn, chưa phải đã cập nhật xong"
              reply: true
  - note:
      over:
        - "http"
        - "db"
      text: "Chỉ trả 202 sau khi commit. Lưu lỗi thì trả lỗi, không ACK"
  - message:
      from: "relay"
      to: "db"
      text: "Đọc các message chưa gửi theo id tăng dần"
      reply: false
  - message:
      from: "relay"
      to: "kafka"
      text: "Gửi từng message (acks=all)"
      reply: false
  - message:
      from: "kafka"
      to: "relay"
      text: "Xác nhận đã nhận"
      reply: true
  - message:
      from: "relay"
      to: "db"
      text: "Đánh dấu đã gửi"
      reply: false
  - note:
      over:
        - "relay"
        - "kafka"
      text: "Kafka lỗi: không đánh dấu, thử lại sau; dữ liệu đã ACK không mất. Bên nhận (chưa có) đọc message từ topic"
