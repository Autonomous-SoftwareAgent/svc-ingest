id: "kieu-vao-ra-chuan-hoa"
type: "class"
title: "Kiểu và giao diện: hợp đồng chuẩn, lớp vào/ra và lớp chuẩn hóa"
tab: "architecture"
sources:
  - "src/ingest/contract.py"
  - "src/ingest/io/http.py"
  - "src/ingest/io/kafka.py"
  - "src/ingest/normalize/registry.py"
  - "src/ingest/normalize/inventory_rates_json.py"
explain:
  meaning: "Hình cho thấy phía ngoài của Ingest: hợp đồng chuẩn mà các lớp cùng biết, lớp vào/ra (nhận HTTP, phát Kafka) và lớp chuẩn hóa (dịch gói tin của từng đối tác sang dạng chuẩn). Theo thiết kế, đổi đối tác hay broker chủ yếu đụng các hộp này chứ không đụng phần xử lý tồn và giá; thêm broker mới còn cần sửa main.make_publisher và config.py (không vẽ). Phần logic nội bộ và nơi lưu ở sơ đồ kieu-logic-luu-tru."
  read:
    - "Mỗi hộp là một tệp (module) hoặc một lớp thật trong mã; nhãn loại ghi trên hộp: module là tệp gom hàm, interface là hợp đồng chỉ khai hàm."
    - "Màu theo lớp: vàng cam là hợp đồng chuẩn, xanh dương là lớp vào/ra, xanh ngọc là lớp chuẩn hóa."
    - "Mũi tên dependency đọc là 'A dùng B' (A import B). http, KafkaPublisher, normalize và inventory_rates_json đều trỏ về contract."
    - "Cạnh 'cài đặt cổng phát' (implementation) nối KafkaPublisher tới Publisher: nó làm đúng hợp đồng phát tin."
    - "Cạnh 'định nghĩa' (composition) cho biết Publisher được khai bên trong contract.py."
    - "inventory_rates_json trỏ tới normalize: nó tự đăng ký vào sổ định dạng, còn registry không biết inventory_rates_json."
  details:
    - term: "contract"
      text: "Nơi các lớp gặp nhau: kiểu dữ liệu chuẩn (Update, NormalizedSubmission, AckResult...), mã lỗi và ngoại lệ. Tệp này không import module nào khác của dịch vụ."
    - term: "Publisher"
      text: "Hợp đồng phát tin ra broker, chỉ một hàm publish. Docstring yêu cầu ném lỗi khi broker chưa xác nhận; đây là nghĩa vụ ghi trong chú thích, KafkaPublisher giữ đúng, mã không ép buộc."
    - term: "KafkaPublisher"
      text: "Bản phát thật bằng Kafka, tạo kết nối khi cần và tạo lại sau lỗi. Nằm ở lớp vào/ra nên không chứa nghiệp vụ."
    - term: "http"
      text: "Tệp nhận HTTP và đổi mã lỗi sang trạng thái HTTP. create_app nhận một bộ Hooks được đưa vào, nên nó không import logic nội bộ."
    - term: "Hooks"
      text: "Do main.py đưa vào http.py: các hàm đăng nhập, nhận lô, kiểm sức khỏe, nhóm AdminHooks cho API nội bộ, và cả hai giá trị cấu hình internal_token và max_body_bytes."
    - term: "normalize"
      text: "Sổ đăng ký định dạng: mỗi định dạng là một hàm ParseFn gắn với một tên. register, get, names thêm và tra cứu."
    - term: "inventory_rates_json"
      text: "Định dạng duy nhất hiện có: biến thân JSON của đối tác thành NormalizedSubmission. Thêm định dạng mới là thêm một tệp giống nó, không sửa tệp này."
  pitfalls:
    - "Không vẽ main.py: đó là nơi duy nhất nối các lớp (config.py không import gì của dịch vụ). Vì vậy không có cạnh từ http tới logic nội bộ dù chúng gọi nhau lúc chạy, qua Hooks do main đưa vào."
    - "inventory_rates_json không có cạnh nào từ phía nạp nó: normalize/__init__.py tự import mọi tệp cùng thư mục bằng importlib lúc import, nên inventory-rates-json được đăng ký khi main import ingest.normalize. test_layers.py quét import tĩnh nên không thấy đường này."
    - "KafkaPublisher cài Publisher kiểu Protocol (khớp theo hình dạng hàm), không kế thừa tường minh. LogPublisher và MemoryPublisher ở io/publishers.py cũng khớp hợp đồng nhưng không vẽ."
    - "Mỗi hộp là một tệp, không phải lớp Python, trừ Publisher và KafkaPublisher. Chỉ liệt kê thành viên chính."
    - "Ranh giới lớp được giữ bởi tests/test_layers.py quét import; hình không chứng minh điều đó. KafkaPublisher đã chạy với broker một nút cục bộ trong tests/test_kafka_rqm.py (cần biến môi trường). Chưa kiểm: Kafka production và đối tác thật."
  basis: "d974d2e4a61f5ac4"
direction: "TB"
