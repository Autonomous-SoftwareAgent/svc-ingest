id: "kieu-logic-luu-tru"
type: "class"
title: "Kiểu và giao diện: logic nội bộ và nơi lưu"
tab: "architecture"
sources:
  - "src/ingest/contract.py"
  - "src/ingest/core/service.py"
  - "src/ingest/core/catalog.py"
  - "src/ingest/core/auth.py"
  - "src/ingest/core/cache.py"
  - "src/ingest/core/relay.py"
  - "src/ingest/core/schema.py"
explain:
  meaning: "Hình cho thấy phần lõi của Ingest: kiểm đối tác, đổi mã, chống trùng, ghi nhật ký và outbox, rồi relay phát đi. Lõi chỉ biết hợp đồng chuẩn (contract, Publisher) và các bảng (schema), không biết HTTP, Kafka hay định dạng đối tác, nên đổi bên ngoài ít khi đụng tới nó. Việc chỉ báo đã nhận sau khi ghi bền đến từ đường chạy trong service.accept (AckResult trả sau khi giao dịch commit), không phải từ cách chia lớp."
  read:
    - "contract và Publisher ở đây chỉ là điểm neo: nội dung đầy đủ ở sơ đồ kieu-vao-ra-chuan-hoa."
    - "Màu xanh lá là logic nội bộ, xám là nơi lưu, vàng cam là hợp đồng chuẩn."
    - "Mũi tên dependency đọc là 'A dùng B' (A import B). schema là đích hay gặp nhất (4 trong 10 cạnh), không phải đa số."
    - "Cạnh association là kiểu dùng một đối tượng được đưa vào từ ngoài: service và catalog nhận TtlCache, relay nhận Publisher."
    - "Không có mũi tên nào đi từ khối xanh lá sang lớp vào/ra hay chuẩn hóa."
  details:
    - term: "service"
      text: "Lõi nhận lô. Thứ tự trong accept: tra lần gửi trùng trước (trace_id cũ được trả lời ngay, chưa kiểm khách sạn), rồi kiểm quyền khách sạn, đổi mã, rồi ghi submission và outbox trong một giao dịch và mới trả AckResult."
    - term: "HotelMaps"
      text: "Bản tra cứu nhỏ (dataclass bất biến) cho một khách sạn của một đối tác: mã khách sạn nội bộ cùng hai bảng đổi mã phòng và gói giá."
    - term: "catalog"
      text: "Đối tác, khách sạn, phòng, gói giá. Chỉ là bản sao để đổi mã; nạp qua API nội bộ."
    - term: "auth"
      text: "Kiểm tên đăng nhập và mật khẩu bằng băm scrypt; catalog dùng hash_password khi đăng ký đối tác."
    - term: "TtlCache"
      text: "Bộ nhớ tạm bảng đổi mã theo cặp đối tác và khách sạn, hết hạn theo cấu hình. invalidate_partner được catalog gọi khi danh mục đổi."
    - term: "relay"
      text: "Đọc outbox theo id tăng dần, phát qua Publisher, chỉ đánh dấu đã gửi khi Publisher không báo lỗi. Gặp lỗi thì dừng để giữ thứ tự."
    - term: "schema"
      text: "Khai sáu bảng PostgreSQL và create_all. Mọi module lõi đọc ghi dữ liệu qua tệp này; chi tiết cột ở sơ đồ du-lieu-bang."
    - term: "Publisher"
      text: "Hợp đồng phát tin ra broker; relay chỉ biết hợp đồng này, không biết Kafka."
    - term: "contract"
      text: "Hợp đồng chuẩn; service nhận NormalizedSubmission và trả AckResult theo nó."
  pitfalls:
    - "Để gọn, cạnh tới contract chỉ vẽ từ service; auth, catalog và relay cũng import contract (PartnerInfo, ErrorCode, MessageKind...). Hình không nói đây là toàn bộ import."
    - "Chỉ vài hộp là lớp thật: TtlCache, Publisher (Protocol) và HotelMaps (dataclass). Còn lại là tệp gồm các hàm, phần lớn nhận engine làm tham số (riêng hash_password và verify_password thì không)."
    - "TtlCache nằm trong từng tiến trình; invalidate_partner chỉ xóa ở tiến trình đã nhận lệnh quản trị. Bản khác có thể còn gạt bỏ dòng cho phòng mới ánh xạ bằng lỗi mã 10 tới khi hết hạn (mặc định 24 giờ)."
    - "Relay giả định MỘT bản chạy, mà nó khởi động trong mọi bản ứng dụng; nhiều worker hay bản sao phá giả định này trừ khi tắt INGEST_RELAY_ENABLED ở các bản còn lại."
    - "Ranh giới lớp được giữ bởi tests/test_layers.py quét import. Chưa kiểm: Kafka production và đối tác thật (broker một nút cục bộ đã được test)."
  basis: "513c0fce79973914"
