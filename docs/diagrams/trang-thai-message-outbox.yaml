id: "trang-thai-message-outbox"
type: "state"
title: "Trạng thái một message trong outbox"
tab: "architecture"
sources:
  - "src/ingest/core/relay.py"
  - "src/ingest/core/schema.py"
explain:
  meaning: "Mỗi message vào outbox ở trạng thái chưa gửi, rồi một tác vụ nền (relay) gửi nó lên Kafka. Sơ đồ cho thấy chỉ có hai trạng thái được lưu, và những tình huống làm một message ở lại trạng thái chưa gửi hoặc tới bên nhận hai lần."
  read:
    - "Đọc từ trái sang phải; chấm đen là lúc message được ghi cùng transaction với lần gửi của nhà cung cấp, chấm có viền là lúc xong."
    - "Mỗi ô là một trạng thái được lưu trong cơ sở dữ liệu: cột thời điểm gửi còn trống (chưa gửi) hoặc đã có giá trị (đã gửi)."
    - "Hai mũi tên vòng lại ô Chưa gửi là hai tình huống message chưa được đánh dấu: gửi lỗi, và đã tới Kafka nhưng chưa ghi được dấu."
  details:
    - term: "Chưa gửi"
      text: "Message nằm trong outbox. Relay lấy theo id tăng dần và gửi; cột thời điểm gửi còn trống cho tới khi Kafka xác nhận. Số đếm lần thử tăng sau mỗi lần gửi lỗi."
    - term: "Đã gửi"
      text: "Kafka đã xác nhận và relay đã ghi thời điểm gửi; message không được lấy lại nữa."
  pitfalls:
    - "\"Đang gửi\" không phải trạng thái lưu: đó chỉ là lúc relay đang gọi Kafka. Chưa có khoảng lùi dần, chưa giới hạn số lần thử, chưa có hàng chờ lỗi; relay thử lại ở vòng kế (mặc định 0,5 giây)."
    - "Một message gửi lỗi chặn MỌI message sau nó, của mọi khách sạn và cả ba topic, cho tới khi gửi được; đây là cái giá của việc giữ thứ tự."
    - "Bên nhận có thể thấy một message hai lần: relay chết sau khi gửi nhưng trước khi đánh dấu, ghi dấu lỗi, hoặc một lần gửi hết giờ vẫn tới được broker sau đó (đã đo với Kafka cục bộ). Bên nhận phải khử trùng theo messageId."
    - "Relay đọc theo id tăng dần; id cấp lúc ghi chứ không phải lúc commit, nên hai lần gửi đồng thời có thể được phát theo thứ tự commit."
    - "Mới thử với Kafka một nút chạy cục bộ; hành vi trên broker production chưa kiểm."
  basis: "4b431f718038b8d4"
direction: "LR"
