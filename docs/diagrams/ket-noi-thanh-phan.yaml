id: "ket-noi-thanh-phan"
type: "flowchart"
title: "Kết nối các thành phần của Ingest"
tab: "architecture"
sources:
  - "src/ingest/main.py"
  - "src/ingest/contract.py"
  - "src/ingest/io/http.py"
  - "src/ingest/io/kafka.py"
  - "src/ingest/normalize/inventory_rates_json.py"
  - "src/ingest/core/service.py"
  - "src/ingest/core/relay.py"
  - "src/ingest/core/catalog.py"
  - "src/ingest/core/auth.py"
  - "src/ingest/core/cache.py"
explain:
  meaning: "Sơ đồ cho thấy các tệp mã của Ingest nối với nhau thế nào, từ lúc nhà cung cấp gửi dữ liệu vào tới lúc message được phát lên Kafka. Ba lớp không import lẫn nhau: chúng chỉ dùng chung các kiểu trong contract.py và được main.py nối lại, nên thêm một định dạng đối tác hay một cách phát mới không đụng tới lớp logic."
  read:
    - "Đọc từ trên xuống theo bốn tầng: Bên gửi, Nhận và chuẩn hóa, Lớp logic nội bộ, Lưu và phát. Trong mỗi tầng đọc từ trái sang phải."
    - "Mũi tên đậm giữa hai tầng gộp nhiều lời gọi từ tầng trên xuống tầng dưới; nhãn của nó tóm tắt các lời gọi đó, mục Chi tiết nói rõ tệp nào gọi tệp nào."
    - "Màu nói lớp của tệp: xanh dương là lớp vào/ra, xanh ngọc là lớp chuẩn hóa, xanh lá là lớp logic nội bộ, hồng là nơi nối các lớp, vàng là hợp đồng chuẩn, xám là thứ nằm ngoài mã của Ingest."
    - "Mũi tên chấm từ io/http.py là lời gọi qua hàm được tiêm vào; main.py thì import thẳng lớp chuẩn hóa và lớp logic."
    - "contract.py đứng riêng, không nối mũi tên nào: không lời gọi nào đi qua nó, mọi lớp chỉ import kiểu dữ liệu từ nó."
  details:
    - term: "contract.py"
      text: "Kiểu dữ liệu chuẩn, mã lỗi, ngoại lệ và giao diện Publisher. Lớp vào/ra, lớp chuẩn hóa và lớp logic đều import nó; nó không gọi ai."
    - term: "Nhà cung cấp"
      text: "Bên gửi gói tồn, điều kiện bán và giá vào POST /v1/inventory-rates. Mới có nhà cung cấp mô phỏng."
    - term: "Dịch vụ nội bộ, vận hành"
      text: "Gọi các đường /internal/v1 để đăng ký đối tác và nạp danh mục khách sạn, phòng, gói giá."
    - term: "io/http.py"
      text: "Lớp vào/ra phía nhận: đọc header Basic (kiểm mật khẩu do core/auth.py làm qua hàm được tiêm), so token Bearer cho /internal/v1, kiểm X-Trace-Id là UUID, giới hạn kích thước gói của đối tác, đổi mã lỗi sang trạng thái HTTP."
    - term: "main.py"
      text: "Nơi duy nhất nối các lớp: tiêm hàm vào io/http.py, chọn bộ chuẩn hóa theo định dạng của đối tác, gọi core/service.py, tạo kết nối cơ sở dữ liệu, chọn bản cài Publisher và khởi động relay."
    - term: "normalize/inventory_rates_json.py"
      text: "Lớp chuẩn hóa: đổi gói của đối tác thành NormalizedSubmission và trả về cho main.py. Mỗi định dạng đối tác là một module tự đăng ký."
    - term: "core/service.py"
      text: "Nhận một lần gửi đã chuẩn hóa: kiểm trùng, kiểm quyền theo khách sạn, đổi mã phòng và gói giá, rồi ghi lần gửi và outbox. Tự đọc các bảng quyền và bảng đổi mã, có nhớ tạm."
    - term: "core/cache.py"
      text: "Nhớ tạm bảng đổi mã theo đối tác và khách sạn, chỉ trong một tiến trình. core/service.py là bên dùng."
    - term: "core/catalog.py, auth.py"
      text: "catalog.py ghi và đọc đối tác, danh mục cho API nội bộ. auth.py kiểm tên đăng nhập và mật khẩu của nhà cung cấp. Cả hai do main.py gọi; core/service.py không gọi chúng."
    - term: "core/relay.py"
      text: "Tác vụ nền chạy trong cùng tiến trình với phần HTTP: đọc outbox theo id tăng dần, gửi từng message qua cổng Publisher, rồi đánh dấu đã gửi. Bản hiện tại giả định chỉ một relay chạy."
    - term: "PostgreSQL"
      text: "Giữ đối tác, danh mục, bảng đổi mã, nhật ký lần gửi và outbox."
    - term: "io/kafka.py"
      text: "Một bản cài của cổng Publisher, dùng Kafka và chỉ coi là đã gửi khi broker xác nhận (acks=all). main.py chọn bản cài này; relay không import nó."
    - term: "Kafka"
      text: "Ba topic cho tồn, điều kiện bán và giá."
    - term: "Bên nhận (chưa có)"
      text: "Theo tài liệu tham khảo, một dịch vụ khác sẽ nhận message và giữ tồn, giá hiện tại. Hiện chưa có dịch vụ nào nhận."
  pitfalls:
    - "Vị trí trong tầng không phải là lớp: io/kafka.py nằm ở tầng Lưu và phát nhưng thuộc lớp vào/ra, xem màu."
    - "Mũi tên đậm cuối gộp cả chiều ngược: relay đọc outbox từ PostgreSQL rồi ghi dấu đã gửi trở lại."
    - "Sơ đồ là cấu trúc; thứ tự thời gian của một lần gửi xem ở sơ đồ trình tự trong tab Nghiệp vụ."
    - "Kafka mới được thử với broker một nút chạy cục bộ; bên nhận chưa tồn tại."
  basis: "811e7ce43e3a26c7"
